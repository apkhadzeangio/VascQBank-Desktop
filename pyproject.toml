[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vascqbank-desktop"
version = "0.8.0"
description = "VascQBank Review Desktop — offline desktop application for reviewing and approving Georgian vascular surgery exam questions"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ramaz Apkhadze" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Natural Language :: Georgian",
    "Environment :: X11 Applications :: Qt",
]
# PySide6-Essentials is the core Qt subset (Core, Gui, Widgets, Svg, ...).
# The full "PySide6" meta-package would pull in WebEngine and other add-ons
# this application never uses, which roughly triples the packaged size.
dependencies = [
    "PySide6-Essentials>=6.7,<7",
    # Word export (Phase 6); pure Python + lxml, works offline
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.gui-scripts]
vascqbank-desktop = "vascqbank_desktop.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vascqbank_desktop.resources" = [
    "fonts/*.ttf", "fonts/OFL.txt", "icons/*.svg",
    # a distribution build places the verified seed here (never committed; see seed/README.md)
    "seed/README.md", "seed/seed-manifest.json", "seed/*.sqlite3",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# the message catalogue is a table of full Georgian sentences
"src/vascqbank_desktop/validation/issues.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
qt_api = "pyside6"
markers = [
    "gui: creates Qt widgets (runs on the offscreen Qt platform unless QT_QPA_PLATFORM is set)",
    "perf: 10,000-question synthetic benchmark (deselect with -m 'not perf')",
]
